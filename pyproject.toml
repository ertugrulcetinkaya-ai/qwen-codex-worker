[project]
name = "qwen-codex-worker"
version = "0.1.0"
description = "Read-only patch and sandbox filesystem workers for a local Qwen endpoint."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "mcp[cli]>=1.0,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "ruff>=0.8,<1",
]

[tool.uv]
# This is a script-style worker; pyproject.toml supplies metadata and
# dependencies without turning the repository into an installable package.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = [
    "qwen_agent.py",
    "qwen_agent_cli.py",
    "qwen_input_limits.py",
    "qwen_patch_cli.py",
    "qwen_worker_server.py",
]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
