name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality, tests, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.12.1"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Type check production modules
        run: uv run mypy

      - name: Ensure unittest discovery is non-empty
        run: >-
          uv run python -c
          "import unittest; count=unittest.defaultTestLoader.discover('.').countTestCases(); print(f'Discovered {count} tests'); raise SystemExit(0 if count >= 208 else 1)"

      - name: Run full unittest suite
        run: uv run python -m unittest discover -v

      - name: Compile source and tests
        run: >-
          uv run python -m compileall -q
          qwen_agent.py qwen_agent_cli.py qwen_input_limits.py qwen_patch_cli.py
          qwen_worker_server.py test_qwen_agent.py test_qwen_patch_cli.py
          test_qwen_worker_server.py

      - name: Audit locked dependencies
        run: uv run pip-audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-sandbox:
    name: macOS sandbox integration
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          version: "0.12.1"

      - name: Install locked development environment
        run: uv sync --frozen --group dev

      - name: Require a usable macOS command sandbox
        run: >-
          uv run python -c
          "import qwen_agent; raise SystemExit(0 if qwen_agent._command_sandbox_available() else 1)"

      - name: Run macOS sandbox integration tests
        run: uv run python -m unittest test_qwen_agent.MacOSCommandSandboxIntegrationTests
